# Responsive Victim Simulator — configuration
#
# audio.input_device / output_device below are set for the deployed Pi
# (device substrings from `python -m victimsim.main --list-devices`, run on
# the Pi itself). On a dev laptop without this hardware, set both to null
# to fall back to the system default mic/speakers.

language: de   # en | de | it — picks the keyword list below and which Vosk model to load

audio:
  input_device: "ReSpeaker"    # matches "ReSpeaker Lite: USB Audio (hw:4,0)" on the Pi
  output_device: "HiFiBerry"   # matches "snd_rpi_hifiberry_dacplus: ... (hw:3,0)" on the Pi
  mic_channels: 2          # ReSpeaker Lite's USB-audio firmware exposes 2 raw mic channels
  mic_sample_rate: 16000   # Vosk wants 16kHz mono
  mic_block_size: 3200     # 0.2s @ 16kHz — smaller = checks for a keyword match more often (lower latency)
  playback_sample_rate: 44100
  voice_channel: left      # stereo output channel carrying victim voice
  knock_channel: right     # stereo output channel driving the knock transducer

trigger:
  # Substrings matched (case-insensitive) against recognized speech, per language.
  keywords:
    en:
      - "hello"
      - "is anybody there"
      - "anyone there"
      - "can you hear me"
      - "rescue"
      - "search and rescue"
    de:
      - "hallo"
      - "ist da jemand"
      - "ist hier jemand"
      - "hört mich jemand"
      - "rettung"
      - "rettungsdienst"
    it:
      - "ciao"
      - "c'è qualcuno"
      - "c'è nessuno"
      - "mi senti"
      - "soccorso"
      - "squadra di soccorso"
  cooldown_seconds: 5      # minimum gap between any two responses, avoids spamming — adjustable live from the dashboard
  response_categories:     # random category chosen each time, then random clip within it
    - shout
    - cry
    - moan
  # A keyword hit is answered with sounds from assets/sounds/<reply_category>/
  # (dedicated recordings, independent of shout/cry/moan above — those are for
  # spontaneous calls). While that folder has no .wav files, the clips of
  # reply_fallback_category stand in, so a keyword is never answered with
  # silence; add real files there and they take over on their own.
  reply_category: reply
  reply_fallback_category: cry
  # Which of the above are currently eligible to be picked — toggle live
  # from the dashboard's checkboxes (checked = included, unchecked =
  # excluded from every mode's random pick). Defaults to all of
  # response_categories if left empty/omitted.
  enabled_categories: [shout, cry, moan]

# Behavior mode:
#   responsive - only reacts when it hears a keyword (default, current behavior)
#   distress   - additionally calls out on its own at normal strength/frequency,
#                simulating a victim actively shouting and knocking for help
#   weak       - additionally calls out on its own, but rarely and at reduced
#                volume/intensity, simulating an exhausted/weak victim
# In "distress" and "weak" modes, the profile below also governs the volume and
# knock chance of keyword replies (a weak victim still sounds weak when spoken
# to) — though not which sound plays: replies use the dedicated reply sounds
# (trigger.reply_category), the profile's response_categories are for its own calls.
behavior:
  mode: responsive
  profiles:
    distress:
      interval_min_seconds: 10
      interval_max_seconds: 20
      volume_multiplier: 1.0
      response_categories: [shout, cry, moan]
      knock_probability: 0.6
    weak:
      interval_min_seconds: 30
      interval_max_seconds: 60
      volume_multiplier: 0.45
      response_categories: [moan, cry]
      knock_probability: 0.15

# Physical "three knocks" trigger: a piezo vibration sensor (e.g. the
# DollaTek 5V piezoelectric film vibration sensor switch module, TTL-level
# output) wired to a GPIO pin lets a rescuer knock on the victim's housing
# to get a reply instead of speaking a keyword. Disabled by default — it's
# real hardware that has to be wired up first (see README, "Physical knock
# sensor"). gpio_pin uses Broadcom (GPIO) numbering, not physical pin
# numbers; avoid GPIO2/3 (I2C) and GPIO18-21 (I2S, used by the HiFiBerry).
knock_sensor:
  enabled: false
  gpio_pin: 27
  min_knocks: 3
  window_seconds: 2.0
  # Must be shorter than the sensor's own pulse width, or the knock gets
  # filtered out as debounce noise and nothing is ever detected. 0.005
  # (5ms) is confirmed working on a real DollaTek module (measured pulse
  # ~18ms on an oscilloscope) — a different sensor may need retuning the
  # same way: if "ready" shows on the dashboard but knocks never register,
  # this is the first thing to lower.
  debounce_seconds: 0.005
  # Mutes a felt knock pattern (still counted/logged, just not answered)
  # without unclaiming the pin. Adjustable live from the dashboard's "Ignore
  # knock sensor" checkbox.
  ignored: false

knock:
  enabled: true
  probability: 0.5         # base knock chance for "responsive" mode
  # Randomly picked from assets/sounds/knock/*.wav, same as shout/cry/moan.
  # "Knocking mode": when true, the knock clip repeats (loop_count times,
  # loop_gap_seconds of silence between repeats) instead of playing once,
  # and is guaranteed on every response (probability above is bypassed
  # while this is on). Toggle live from the dashboard too.
  loop_enabled: false
  loop_count: 10
  loop_gap_seconds: 0.2

# Web dashboard: status/log monitoring + live mode/language/volume control,
# reachable from any device on the same WLAN as the Pi.
web:
  host: 0.0.0.0   # 0.0.0.0 = reachable over WLAN; use 127.0.0.1 to restrict to the Pi itself
  port: 8080

# The Pi throttles ARM core frequency starting ~80°C and hard-limits at
# 85°C (official Raspberry Pi thermal behavior). cpu_temp_warning_c sets
# when the dashboard's CPU temp card switches to a warning state — a few
# degrees below 80 by default, so you notice before throttling starts.
monitoring:
  cpu_temp_warning_c: 75.0

# Voice (shout/cry/moan) and knock volume are independent — each 0.0-1.0,
# adjustable live from the dashboard too. Both are further scaled by the
# active behavior profile's volume_multiplier (see `behavior` above).
volume:
  voice: 0.9
  knock: 0.9

# Standalone WLAN: make the Pi broadcast its own WiFi network so a phone can
# reach the dashboard directly, with no external router needed (e.g. in the
# field during a training exercise). This section only declares the desired
# SSID/password — applying it is a separate, explicit step:
# `bash scripts/setup_wifi_ap.sh` (see README).
#
# `interface` targets a USB WiFi dongle (commonly "wlan1" — check with
# `nmcli device status`), not the Pi's onboard "wlan0" radio: the onboard
# radio stays a normal WiFi client connected to your router (SSH,
# `git pull`, software maintenance), and the dongle broadcasts the hotspot
# for the dashboard — so enabling this never disconnects you. If you don't
# have a dongle, set this to "wlan0" instead; the Pi 4B then has only one
# WiFi radio, and enabling the hotspot on it disconnects any existing WiFi
# client connection there (including an SSH session over WiFi) — the script
# detects and warns about this before doing anything.
network:
  ap_mode:
    enabled: false
    ssid: "VictimSim"
    password: "rescue1234"   # WPA2-PSK — change this, 8+ chars required
    interface: wlan1
