<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victim Simulator</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 1rem 1rem 2rem;
    background: #111; color: #eee;
  }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem; margin-bottom: 1rem;
  }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 0.75rem; }
  .card .label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.03em; }
  .card .value { font-size: 1.05rem; margin-top: 0.3rem; word-break: break-word; }
  .card.warning { border-color: #e5a83a; background: #2a1f0f; }
  .card.warning .value { color: #ffb547; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; margin-bottom: 1rem;
    align-items: center; background: #1c1c1c; border: 1px solid #333; border-radius: 8px;
    padding: 0.75rem;
  }
  .field { display: flex; flex-direction: column; gap: 0.25rem; }
  .field label { font-size: 0.75rem; color: #999; }
  select, button, input[type=range] {
    font-size: 1rem; padding: 0.4rem 0.5rem; border-radius: 6px;
    border: 1px solid #444; background: #222; color: #eee;
  }
  input[type=range] { padding: 0; width: 140px; }
  input[type=checkbox] { width: 1.2rem; height: 1.2rem; align-self: flex-start; accent-color: #4caf50; }
  .checkbox-row { display: flex; gap: 0.75rem; }
  .checkbox-item { display: flex; align-items: center; gap: 0.35rem; font-size: 0.95rem; text-transform: capitalize; }
  .checkbox-item input[type=checkbox] { align-self: auto; }
  button { cursor: pointer; align-self: flex-end; }
  button:hover { background: #333; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.active { border-color: #4caf50; background: #16281a; color: #9be3a4; }
  button.danger { border-color: #7a3b3b; color: #f0a0a0; }
  button.danger:hover { background: #3a1f1f; }
  .banner {
    position: sticky; top: 0; z-index: 10; margin: 0 0 0.75rem; padding: 0.6rem 0.8rem;
    border: 1px solid #a33; border-radius: 8px; background: #2a1010; color: #ffb3b3;
    font-size: 0.95rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  #log {
    background: #000; border: 1px solid #333; border-radius: 8px;
    padding: 0.5rem 0.75rem; height: 45vh; overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem;
  }
  .log-line { padding: 0.15rem 0; border-bottom: 1px solid #1a1a1a; }
  .log-line .ts { color: #666; margin-right: 0.5rem; }
  .kind-heard { color: #6cf; }
  .kind-response { color: #6f6; }
  .kind-cooldown { color: #fc6; }
  .kind-system { color: #999; }
  .dot { display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; margin-right: 0.4em; }
  .dot.ok { background: #4caf50; }
  .dot.bad { background: #e53935; }
</style>
</head>
<body>
  <h1>Responsive Victim Simulator</h1>
  <div id="error" class="banner" role="alert" title="Click to dismiss" hidden></div>

  <div class="grid">
    <div class="card"><div class="label">Listener</div><div class="value" id="s-listener">-</div></div>
    <div class="card"><div class="label">Uptime</div><div class="value" id="s-uptime">-</div></div>
    <div class="card"><div class="label">Last heard</div><div class="value" id="s-last-heard">-</div></div>
    <div class="card"><div class="label">Last response</div><div class="value" id="s-last-response">-</div></div>
    <div class="card"><div class="label">Counts</div><div class="value" id="s-counts">-</div></div>
    <div class="card" id="temp-card"><div class="label">CPU temp</div><div class="value" id="s-temp">-</div></div>
    <div class="card"><div class="label">Clock</div><div class="value" id="s-clock">-</div></div>
    <div class="card"><div class="label">Knocking mode</div><div class="value" id="s-knock-loop">-</div></div>
    <div class="card"><div class="label">Keyword reply</div><div class="value" id="s-reply">-</div></div>
    <div class="card"><div class="label">Knock chance</div><div class="value" id="s-knock-chance">-</div></div>
    <div class="card"><div class="label">Network</div><div class="value" id="s-network">-</div></div>
  </div>

  <div class="controls">
    <div class="field">
      <label for="language">Language</label>
      <select id="language">
        <option value="en">English</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
      </select>
    </div>
    <div class="field">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="responsive">Responsive</option>
        <option value="distress">Distress</option>
        <option value="weak">Weak</option>
      </select>
    </div>
    <div class="field">
      <label for="voice-volume">Voice volume</label>
      <input type="range" id="voice-volume" min="0" max="1" step="0.05">
    </div>
    <div class="field">
      <label for="knock-volume">Knock volume</label>
      <input type="range" id="knock-volume" min="0" max="1" step="0.05">
    </div>
    <div class="field">
      <label for="cooldown">Cooldown (<span id="cooldown-value">-</span>s)</label>
      <input type="range" id="cooldown" min="0" max="10" step="1">
    </div>
    <div class="field">
      <label for="knock-loop">Knocking mode (loop)</label>
      <input type="checkbox" id="knock-loop">
    </div>
    <div class="field">
      <label>Voice sounds</label>
      <div class="checkbox-row" id="voice-categories"></div>
    </div>
    <button id="trigger">Trigger now</button>
    <button id="knock-always" title="Force the chance that a response includes a knock to 100% in every mode. Click again to undo.">Knock on every response</button>
    <button id="reset" class="danger" title="Set language, mode, volumes, cooldown, knocking and voice sounds back to config.yaml's values">Reset to defaults</button>
  </div>

  <div id="log"></div>

<script>
let sinceTs = 0;
const logEl = document.getElementById('log');
const errEl = document.getElementById('error');
let errTimer = null;

function showError(message) {
  errEl.textContent = message;
  errEl.hidden = false;
  clearTimeout(errTimer);
  errTimer = setTimeout(clearError, 30000);  // long enough to read on a phone
}

function clearError() {
  errEl.hidden = true;
  errEl.textContent = '';
}
errEl.addEventListener('click', clearError);

const LANGUAGE_LABELS = { en: 'English', de: 'German', it: 'Italian' };

// The Pi's clock may be wrong (no battery-backed RTC, no NTP in AP mode).
// clockOffsetSeconds shifts every displayed timestamp to line up with this
// device's own clock instead — recomputed on every status poll, so it
// self-corrects if the Pi's clock later gets fixed (e.g. it regains
// internet and syncs via NTP) mid-session.
let clockOffsetSeconds = 0;
let knockOverride = null;  // last-seen server value; the button toggles it

function fmtTs(ts) {
  return new Date((ts + clockOffsetSeconds) * 1000).toLocaleTimeString();
}

function fmtOffset(seconds) {
  const abs = Math.abs(seconds);
  if (abs < 5) return 'in sync';
  const sign = seconds > 0 ? '+' : '-';
  const h = Math.floor(abs / 3600);
  const m = Math.floor((abs % 3600) / 60);
  const s = Math.floor(abs % 60);
  const parts = [];
  if (h) parts.push(`${h}h`);
  if (h || m) parts.push(`${m}m`);
  parts.push(`${s}s`);
  return `${sign}${parts.join(' ')} (Pi clock)`;
}

const voiceCategoriesEl = document.getElementById('voice-categories');

function onVoiceCategoryChange() {
  const checked = Array.from(voiceCategoriesEl.querySelectorAll('input[type=checkbox]:checked'))
    .map(el => el.dataset.category);
  postJson('/api/voice-categories', { enabled_categories: checked });
}

function renderVoiceCategories(available, enabled) {
  // Only rebuild the checkboxes if the known category list itself changed —
  // rebuilding every poll would drop focus/mid-click state.
  const key = JSON.stringify(available);
  if (voiceCategoriesEl.dataset.available !== key) {
    voiceCategoriesEl.dataset.available = key;
    voiceCategoriesEl.innerHTML = '';
    for (const category of available) {
      const label = document.createElement('label');
      label.className = 'checkbox-item';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.id = `cat-${category}`;
      input.dataset.category = category;
      input.addEventListener('change', onVoiceCategoryChange);
      label.appendChild(input);
      label.append(category);
      voiceCategoriesEl.appendChild(label);
    }
  }
  // Always sync (see the comment by the knock-loop checkbox above for why
  // checkboxes don't get the "skip while focused" treatment).
  const enabledSet = new Set(enabled);
  for (const category of available) {
    const input = document.getElementById(`cat-${category}`);
    if (input) input.checked = enabledSet.has(category);
  }
}

async function pollStatus(force = false) {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) return;
    const s = await res.json();
    clockOffsetSeconds = (Date.now() / 1000) - s.server_time;
    document.getElementById('s-clock').textContent = fmtOffset(clockOffsetSeconds);

    // Text nodes, not innerHTML: the reason is free text (device names, exception messages).
    const listenerEl = document.getElementById('s-listener');
    const dot = document.createElement('span');
    dot.className = 'dot ' + (s.listener_ready ? 'ok' : 'bad');
    listenerEl.replaceChildren(dot, document.createTextNode(
      s.listener_ready ? 'listening' : 'not ready' + (s.listener_error ? `: ${s.listener_error}` : '')));
    document.getElementById('s-uptime').textContent = Math.round(s.uptime_seconds) + 's';
    document.getElementById('s-last-heard').textContent = s.last_heard
      ? `"${s.last_heard.text}" (${fmtTs(s.last_heard.ts)})` : 'none yet';
    document.getElementById('s-last-response').textContent = s.last_response
      ? `${s.last_response.category}${s.last_response.knocked ? ' + knock' : ''} (${fmtTs(s.last_response.ts)})` : 'none yet';
    document.getElementById('s-counts').textContent = `${s.heard_count} heard / ${s.response_count} responses`;
    document.getElementById('s-temp').textContent = s.cpu_temp_c != null
      ? s.cpu_temp_c + ' °C' + (s.cpu_temp_warning ? ' — warning: near throttle temp' : '')
      : 'n/a';
    document.getElementById('temp-card').classList.toggle('warning', !!s.cpu_temp_warning);
    document.getElementById('s-knock-loop').textContent = s.knock_loop_enabled ? 'on (looping)' : 'off';
    const rs = s.reply_sounds;  // dedicated sounds played when a keyword is heard
    document.getElementById('s-reply').textContent = !rs ? '-'
      : rs.clips ? `${rs.category}: ${rs.clips} file${rs.clips === 1 ? '' : 's'}`
      : rs.placeholder ? `stand-in: ${rs.placeholder} (no ${rs.category} files yet)`
      : `no sounds available!`;
    knockOverride = s.knock_probability_override;
    document.getElementById('s-knock-chance').textContent =
      `${Math.round(s.knock_probability * 100)}%` +
      (s.knock_loop_enabled ? ' (knocking mode)' : knockOverride !== null ? ' (forced)' : '');
    const knockBtn = document.getElementById('knock-always');
    knockBtn.classList.toggle('active', knockOverride !== null);
    knockBtn.textContent = knockOverride === null ? 'Knock on every response'
      : knockOverride === 1 ? 'Knock on every response: ON (click to undo)'
      : `Knock chance forced to ${Math.round(knockOverride * 100)}% (click to undo)`;
    document.getElementById('s-network').textContent = s.ap_mode_enabled
      ? `AP mode ("${s.ap_mode_ssid}")` : 'client WiFi';

    // Skip a control while the user is mid-interaction with it (e.g. dragging a
    // slider) — unless `force`: right after a request finished, the control must
    // show what the server actually did, even if it still has focus.
    const active = force ? null : document.activeElement && document.activeElement.id;
    const languageEl = document.getElementById('language');
    for (const opt of languageEl.options) {
      const installed = !s.languages || s.languages[opt.value] !== false;
      opt.disabled = !installed && opt.value !== s.language;
      opt.textContent = LANGUAGE_LABELS[opt.value] + (installed ? '' : ' (not installed)');
    }
    if (active !== 'language') languageEl.value = s.language;
    if (active !== 'mode') document.getElementById('mode').value = s.mode;
    if (active !== 'voice-volume') document.getElementById('voice-volume').value = s.voice_volume;
    if (active !== 'knock-volume') document.getElementById('knock-volume').value = s.knock_volume;
    if (active !== 'cooldown') document.getElementById('cooldown').value = s.cooldown_seconds;
    document.getElementById('cooldown-value').textContent = Math.round(s.cooldown_seconds);
    // Checkboxes retain focus after a click (unlike a slider mid-drag or an
    // open dropdown), so always sync them — otherwise a rejected change
    // (e.g. unchecking the last voice category) would stay stuck showing
    // the wrong state until something else takes focus.
    document.getElementById('knock-loop').checked = s.knock_loop_enabled;
    renderVoiceCategories(s.voice_categories.available, s.voice_categories.enabled);
  } catch (e) {
    // dashboard server briefly unreachable (e.g. mid-restart) — ignore, retry next tick
  }
}

async function pollLog() {
  try {
    const res = await fetch(`/api/log?since=${sinceTs}`);
    if (!res.ok) return;
    const entries = await res.json();
    for (const e of entries) {
      sinceTs = Math.max(sinceTs, e.ts);
      const line = document.createElement('div');
      line.className = 'log-line';
      // Built from text nodes: messages contain recognized speech, device names and
      // exception text, none of which should ever be interpreted as HTML.
      const ts = document.createElement('span');
      ts.className = 'ts';
      ts.textContent = fmtTs(e.ts);
      const kind = document.createElement('span');
      kind.className = `kind-${String(e.kind).replace(/[^a-z]/g, '')}`;
      kind.textContent = `[${e.kind}]`;
      line.append(ts, kind, document.createTextNode(' ' + e.message));
      logEl.appendChild(line);
    }
    if (entries.length) logEl.scrollTop = logEl.scrollHeight;
  } catch (e) {
    // ignore, retry next tick
  }
}

async function postJson(url, body) {
  clearError();
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      showError(data.error || `request failed (${res.status})`);
    }
  } catch (e) {
    showError('request failed: server unreachable');
  } finally {
    pollStatus(true);  // show the server's real state now (also reverts a rejected choice)
  }
}

document.getElementById('language').addEventListener('change', e => postJson('/api/language', { language: e.target.value }));
document.getElementById('mode').addEventListener('change', e => postJson('/api/mode', { mode: e.target.value }));
document.getElementById('voice-volume').addEventListener('change', e => postJson('/api/volume', { voice: parseFloat(e.target.value) }));
document.getElementById('knock-volume').addEventListener('change', e => postJson('/api/volume', { knock: parseFloat(e.target.value) }));
document.getElementById('knock-loop').addEventListener('change', e => postJson('/api/knock-loop', { enabled: e.target.checked }));
document.getElementById('cooldown').addEventListener('input', e => {
  document.getElementById('cooldown-value').textContent = e.target.value; // live readout while dragging
});
document.getElementById('cooldown').addEventListener('change', e => postJson('/api/cooldown', { cooldown_seconds: parseFloat(e.target.value) }));
document.getElementById('trigger').addEventListener('click', () => postJson('/api/trigger', {}));
document.getElementById('knock-always').addEventListener('click', () =>
  postJson('/api/knock-probability', { probability: knockOverride === null ? 1 : null }));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm("Reset language, mode, volumes, cooldown, knocking and voice sounds to config.yaml's defaults?")) return;
  // Sliders/selects skip syncing while focused (so a drag isn't overwritten);
  // some browsers (Safari) don't focus a button on click, so release focus
  // explicitly or a just-touched slider would keep showing its old value.
  if (document.activeElement) document.activeElement.blur();
  postJson('/api/reset-settings', {});
});

pollStatus();
pollLog();
setInterval(() => pollStatus(), 2000);
setInterval(pollLog, 1500);
</script>
</body>
</html>
